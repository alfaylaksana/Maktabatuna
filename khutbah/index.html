<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arsip Khutbah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f1; --surface:#fff; --ink:#1c2927; --muted:#5d6b68;
  --accent:#1f5c5b; --line:#d5dcd8; --gold:#a8873a;
  --serif:"Source Serif 4",Georgia,serif; --arab:"Amiri","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a19; --surface:#1a2523; --ink:#e6ece9; --muted:#97a5a1;
    --accent:#6fb5b2; --line:#2c3a37; --gold:#cfae5e;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:18px; line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.wrap{max-width:42rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.6rem;margin:.5rem 0 .25rem;line-height:1.2}
.sub{color:var(--muted);margin:0 0 1.25rem;font-size:.95rem}
input[type=search]{
  width:100%;padding:.75rem .9rem;font:inherit;font-size:1rem;
  color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;
}
input[type=search]:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0 1.25rem}
.tag{
  font:inherit;font-size:.85rem;padding:.3rem .7rem;cursor:pointer;
  background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;
}
.tag[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.item{
  display:block;padding:.9rem 0;border-top:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.item:last-child{border-bottom:1px solid var(--line)}
.item h2{font-size:1.15rem;margin:0 0 .15rem;color:var(--accent)}
.meta{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);padding:1.5rem 0}
.back{
  display:inline-block;margin:.5rem 0 1rem;color:var(--accent);
  text-decoration:none;font-size:.95rem;
}
article h1{font-size:1.5rem}
article .meta{margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--gold)}
article p{margin:0 0 1.1rem}
article p[dir=rtl]{font-family:var(--arab);font-size:1.5rem;line-height:2;text-align:right}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Memuat…</p></div>

<script>
(function(){
  var app = document.getElementById('app');
  var data = [];
  var query = '';
  var activeTema = '';

  var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function tgl(s){
    var p = String(s||'').split('-');
    if(p.length !== 3) return s || '';
    return parseInt(p[2],10) + ' ' + bulan[parseInt(p[1],10)-1] + ' ' + p[0];
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hasArabic(s){ return /[\u0600-\u06FF]/.test(s); }

  function renderList(){
    var temaList = [];
    data.forEach(function(k){ if(k.tema && temaList.indexOf(k.tema) < 0) temaList.push(k.tema); });

    var q = query.trim().toLowerCase();
    var hasil = data.filter(function(k){
      if(activeTema && k.tema !== activeTema) return false;
      if(!q) return true;
      return (k.judul+' '+(k.tema||'')+' '+(k.tempat||'')+' '+(k.isi||'')).toLowerCase().indexOf(q) >= 0;
    });

    var h = '<h1>Arsip Khutbah</h1><p class="sub">' + data.length + ' khutbah</p>';
    h += '<input type="search" id="cari" placeholder="Cari judul atau isi" value="' + esc(query) + '" aria-label="Cari khutbah">';
    if(temaList.length){
      h += '<div class="tags">';
      temaList.forEach(function(t){
        h += '<button class="tag" data-tema="' + esc(t) + '" aria-pressed="' + (t===activeTema) + '">' + esc(t) + '</button>';
      });
      h += '</div>';
    }
    if(!hasil.length){
      h += '<p class="empty">Tidak ada khutbah yang cocok. Coba kata kunci lain.</p>';
    } else {
      hasil.forEach(function(k){
        h += '<a class="item" href="#' + esc(k.id) + '"><h2>' + esc(k.judul) + '</h2>' +
             '<div class="meta">' + esc(tgl(k.tanggal)) + (k.tempat ? ', ' + esc(k.tempat) : '') + '</div></a>';
      });
    }
    app.innerHTML = h;

    var cari = document.getElementById('cari');
    cari.addEventListener('input', function(){
      query = cari.value;
      var pos = cari.selectionStart;
      renderList();
      var c = document.getElementById('cari');
      c.focus(); c.setSelectionRange(pos,pos);
    });
    Array.prototype.forEach.call(app.querySelectorAll('.tag'), function(b){
      b.addEventListener('click', function(){
        var t = b.getAttribute('data-tema');
        activeTema = (activeTema === t) ? '' : t;
        renderList();
      });
    });
  }

  function renderDetail(id){
    var k = data.filter(function(x){ return x.id === id; })[0];
    if(!k){ location.hash = ''; return; }
    var paras = String(k.isi||'').split(/\n\s*\n/).map(function(p){
      p = p.trim();
      return p ? '<p dir="' + (hasArabic(p) ? 'rtl' : 'auto') + '">' + esc(p).replace(/\n/g,'<br>') + '</p>' : '';
    }).join('');
    app.innerHTML = '<a class="back" href="#">Kembali ke daftar</a>' +
      '<article><h1>' + esc(k.judul) + '</h1>' +
      '<div class="meta">' + esc(tgl(k.tanggal)) + (k.tempat ? ', ' + esc(k.tempat) : '') + (k.tema ? ', ' + esc(k.tema) : '') + '</div>' +
      paras + '</article>';
    window.scrollTo(0,0);
    document.title = k.judul + ' | Arsip Khutbah';
  }

  function route(){
    var id = decodeURIComponent(location.hash.replace(/^#/,''));
    if(id){ renderDetail(id); }
    else { document.title = 'Arsip Khutbah'; renderList(); }
  }

  fetch('khutbah.json', {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      data = j.slice().sort(function(a,b){ return String(b.tanggal).localeCompare(String(a.tanggal)); });
      window.addEventListener('hashchange', route);
      route();
    })
    .catch(function(){
      app.innerHTML = '<p class="empty">Data khutbah gagal dimuat. Pastikan file khutbah.json ada di folder yang sama dengan index.html, dan halaman dibuka lewat GitHub Pages (bukan langsung dari file).</p>';
    });
})();
</script>
</body>
</html>
