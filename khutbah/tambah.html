<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tambah Khutbah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f1; --surface:#fff; --ink:#1c2927; --muted:#5d6b68;
  --accent:#1f5c5b; --line:#d5dcd8; --gold:#a8873a;
  --ok:#1d6b3a; --err:#a1302a;
  --serif:"Source Serif 4",Georgia,serif; --arab:"Amiri","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121a19; --surface:#1a2523; --ink:#e6ece9; --muted:#97a5a1;
    --accent:#6fb5b2; --line:#2c3a37; --gold:#cfae5e;
    --ok:#6fcf97; --err:#f08a84;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:18px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
.wrap{max-width:42rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:1.5rem;margin:.5rem 0 1rem}
label{display:block;font-size:.9rem;color:var(--muted);margin:1rem 0 .3rem}
input,textarea,button{font:inherit;font-size:1rem}
input,textarea{
  width:100%;padding:.7rem .85rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;
}
textarea{min-height:16rem;line-height:1.7;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (max-width:30rem){.row{grid-template-columns:1fr}}
.btn{
  display:block;width:100%;margin-top:1.5rem;padding:.9rem;cursor:pointer;
  background:var(--accent);color:#fff;border:0;border-radius:6px;font-weight:600;
}
@media (prefers-color-scheme:dark){.btn{color:#0d1514}}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:.4rem 0;cursor:pointer;text-decoration:underline;font-size:.9rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;margin-bottom:1.25rem}
.box h2{font-size:1rem;margin:0 0 .4rem}
.box p{margin:.2rem 0;font-size:.9rem;color:var(--muted)}
#status{margin-top:1rem;min-height:1.5rem;font-size:.95rem}
#status.ok{color:var(--ok)}
#status.err{color:var(--err)}
.hint{font-size:.8rem;color:var(--muted);margin:.3rem 0 0}
.btn2{display:block;width:100%;margin-top:.6rem;padding:.8rem;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px}
.btn2.bahaya{color:var(--err);border-color:var(--err)}
select{width:100%;padding:.7rem .85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:1rem}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.toolbar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.2rem 0 .5rem;position:sticky;top:0;z-index:2;background:var(--bg);padding:.35rem 0}
.toolbar button{min-width:2.6rem;height:2.6rem;padding:0 .6rem;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;font-size:1rem}
.toolbar button:disabled{opacity:.4;cursor:default}
.toolbar .sep{width:1px;height:1.6rem;background:var(--line);margin:0 .2rem}
.toolbar .pra{margin-left:auto;font-size:.9rem}
.isi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem}
.isi p{margin:0 0 1.1rem}
.isi p.rtl{font-family:var(--arab);font-size:1.5rem;line-height:2;text-align:right}
.isi .ar{font-family:var(--arab);font-size:1.2em;line-height:1.8}
.isi p.rtl .ar{font-size:1em}
.isi p.a-kiri{text-align:left}
.isi p.a-tengah{text-align:center}
.isi p.a-kanan{text-align:right}
.isi p.a-rata{text-align:justify}
.lang{display:flex;gap:.35rem;margin:1rem 0 0}
.lang button{font:inherit;font-size:.9rem;padding:.4rem 1rem;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px}
.lang button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.lang button[aria-pressed=true]{color:#0d1514}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="judulHalaman">Tambah Khutbah</h1>

  <div class="box" id="tokenBox">
    <h2>Token GitHub</h2>
    <p id="tokenInfo"></p>
    <div id="tokenForm">
      <input type="password" id="token" placeholder="Tempel token (github_pat_...)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Token GitHub">
      <button type="button" class="link" id="simpanToken">Simpan token di HP ini</button>
    </div>
    <button type="button" class="link" id="hapusToken" hidden>Hapus token dari HP ini</button>
  </div>

  <label for="pilihEdit">Edit khutbah yang sudah ada</label>
  <select id="pilihEdit"><option value="">Tidak, tambah khutbah baru</option></select>

  <div class="lang" id="tabBahasa" role="group" aria-label="Bahasa naskah">
    <button type="button" data-l="id" aria-pressed="true">Indonesia</button>
    <button type="button" data-l="jw" aria-pressed="false">Jawa</button>
  </div>
  <p class="hint">Judul dan naskah di bawah mengikuti bahasa yang dipilih. Versi Indonesia wajib, versi Jawa boleh dikosongkan.</p>

  <label for="judul" id="lblJudul">Judul (Indonesia)</label>
  <input id="judul" type="text" autocomplete="off">

  <div class="row">
    <div>
      <label for="tanggal">Tanggal</label>
      <input id="tanggal" type="date">
    </div>
    <div>
      <label for="tema">Tema</label>
      <input id="tema" type="text" list="temaList" autocomplete="off">
      <datalist id="temaList"></datalist>
    </div>
  </div>

  <label for="tempat">Tempat</label>
  <input id="tempat" type="text" autocomplete="off">

  <label for="isi" id="lblIsi">Naskah khutbah (Indonesia)</label>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Format teks">
    <button type="button" data-fmt="**" title="Tebal" aria-label="Tebal"><b>B</b></button>
    <button type="button" data-fmt="//" title="Miring" aria-label="Miring"><i>I</i></button>
    <button type="button" data-fmt="__" title="Garis bawah" aria-label="Garis bawah"><u>U</u></button>
    <span class="sep"></span>
    <button type="button" data-align="kiri" title="Rata kiri" aria-label="Rata kiri"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 3h16M1 7h10M1 11h16M1 15h10"/></svg></button>
    <button type="button" data-align="tengah" title="Tengah" aria-label="Tengah"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 3h16M4 7h10M1 11h16M4 15h10"/></svg></button>
    <button type="button" data-align="kanan" title="Rata kanan" aria-label="Rata kanan"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 3h16M7 7h10M1 11h16M7 15h10"/></svg></button>
    <button type="button" data-align="rata" title="Rata kiri-kanan (justify)" aria-label="Justify"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 3h16M1 7h16M1 11h16M1 15h16"/></svg></button>
    <button type="button" class="pra" id="btnPratinjau">Pratinjau</button>
  </div>
  <textarea id="isi" dir="auto"></textarea>
  <div class="isi" id="pratinjau" hidden></div>
  <p class="hint">Pisahkan paragraf dengan satu baris kosong. Tempel teks Arab dan Indonesia seperti biasa.</p>

  <button type="button" class="btn" id="simpan">Simpan ke arsip</button>
  <button type="button" class="btn2" id="batalEdit" hidden>Batal edit</button>
  <button type="button" class="btn2 bahaya" id="hapus" hidden>Hapus khutbah ini</button>
  <div id="status" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
  // Pengaturan repo
  var OWNER = 'alfaylaksana';
  var REPO  = 'Maktabatuna';
  var PATH  = 'khutbah/khutbah.json';
  var BRANCH = '';   // kosong = pakai branch bawaan repo
  var KEY = 'arsipKhutbahToken';

  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $('status');

  function setStatus(msg, cls){
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  // Penyimpanan token (hanya di browser ini)
  function getToken(){
    try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; }
  }
  function saveToken(t){
    try { localStorage.setItem(KEY, t); return true; } catch(e){ return false; }
  }
  function clearToken(){
    try { localStorage.removeItem(KEY); } catch(e){}
  }
  function showTokenState(){
    var has = !!getToken();
    $('tokenInfo').textContent = has ? 'Token tersimpan di HP ini.' : 'Belum ada token. Tempel sekali, lalu tersimpan di HP ini.';
    $('tokenForm').hidden = has;
    $('hapusToken').hidden = !has;
  }
  $('simpanToken').addEventListener('click', function(){
    var t = $('token').value.trim();
    if(!t){ setStatus('Token masih kosong.', 'err'); return; }
    if(!saveToken(t)){ setStatus('Browser tidak mengizinkan penyimpanan. Token hanya berlaku sampai halaman ditutup.', 'err'); sessionTok = t; }
    $('token').value = '';
    setStatus('', '');
    showTokenState();
  });
  $('hapusToken').addEventListener('click', function(){
    clearToken(); sessionTok = ''; showTokenState();
  });
  var sessionTok = '';
  function token(){ return getToken() || sessionTok; }

  // Base64 <-> UTF-8
  function b64ToText(b64){
    var bin = atob(b64.replace(/\s/g,''));
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function textToB64(text){
    var bytes = new TextEncoder().encode(text);
    var bin = '';
    for(var i=0;i<bytes.length;i+=8192){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
    }
    return btoa(bin);
  }

  function api(method, body){
    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH;
    if(method === 'GET' && BRANCH) url += '?ref=' + encodeURIComponent(BRANCH);
    var opt = {
      method: method,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token(),
        'X-GitHub-Api-Version': '2022-11-28'
      },
      cache: 'no-store'
    };
    if(body){
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt);
  }

  function slug(s){
    return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'khutbah';
  }
  function bersihkanNaskah(s){
    return s.replace(/\r\n?/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  }

  function errPesan(res){
    if(res.status === 401) return 'Token ditolak (salah atau sudah kedaluwarsa). Hapus token lalu buat yang baru.';
    if(res.status === 403) return 'Token tidak punya izin. Pastikan Contents diset Read and write.';
    if(res.status === 404) return 'File atau repo tidak ketemu. Cek nama repo dan pastikan token boleh mengakses Maktabatuna.';
    if(res.status === 409 || res.status === 422) return 'Data di GitHub baru saja berubah. Tap Simpan sekali lagi.';
    return 'Gagal (kode ' + res.status + '). Coba lagi sebentar.';
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  // ---- Render naskah: **tebal**, //miring//, __garis bawah__, {kiri|tengah|kanan|rata} di awal paragraf
  var AR = '\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF';
  var reArab = new RegExp('[' + AR + ']', 'g');
  var reRun = new RegExp('[' + AR + '][' + AR + '\u0640\\s]*[' + AR + ']|[' + AR + ']', 'g');
  function renderIsi(isi){
    return String(isi||'').split(/\n\s*\n/).map(function(p){
      p = p.trim();
      if(!p) return '';
      var align = '';
      var m = p.match(/^\{(kiri|kanan|tengah|rata)\}\s*/);
      if(m){ align = m[1]; p = p.slice(m[0].length); }
      var plain = p.replace(/\*\*|\/\/|__/g, '');
      var nAr = (plain.match(reArab) || []).length;
      var nLa = (plain.match(/[A-Za-z]/g) || []).length;
      var dir = (nAr + nLa === 0) ? 'auto' : (nAr > nLa ? 'rtl' : 'ltr');
      var h = esc(p);
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
           .replace(/__(.+?)__/g, '<u>$1</u>')
           .replace(/\/\/(.+?)\/\//g, '<em>$1</em>');
      h = h.replace(reRun, function(x){ return '<span class="ar" lang="ar">' + x + '</span>'; });
      h = h.replace(/\n/g, '<br>');
      var cls = (dir === 'rtl' ? 'rtl ' : '') + (align ? 'a-' + align : '');
      return '<p dir="' + dir + '" class="' + cls.trim() + '">' + h + '</p>';
    }).join('');
  }

  // ---- Toolbar format
  function bungkus(m){
    var ta = $('isi'), v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, L = m.length;
    var sel = v.slice(s, e);
    if(s >= L && v.slice(s-L, s) === m && v.slice(e, e+L) === m){
      ta.value = v.slice(0, s-L) + sel + v.slice(e+L);
      ta.setSelectionRange(s-L, e-L);
    } else if(sel.length >= 2*L && sel.slice(0, L) === m && sel.slice(-L) === m){
      var inner = sel.slice(L, -L);
      ta.value = v.slice(0, s) + inner + v.slice(e);
      ta.setSelectionRange(s, s + inner.length);
    } else {
      ta.value = v.slice(0, s) + m + sel + m + v.slice(e);
      ta.setSelectionRange(s + L, e + L);
    }
    ta.focus();
  }
  function rata(a){
    var ta = $('isi'), v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    var i = s > 1 ? v.lastIndexOf('\n\n', s - 2) : -1;
    var pStart = i < 0 ? 0 : i + 2;
    var j = v.indexOf('\n\n', e);
    var pEnd = j < 0 ? v.length : j;
    if(pEnd < pStart) pEnd = pStart;
    var re = /^\{(kiri|kanan|tengah|rata)\}[ ]?/;
    var segs = v.slice(pStart, pEnd).split('\n\n');
    var semua = segs.every(function(g){
      if(!g.trim()) return true;
      var m = g.match(re);
      return !!m && m[1] === a;
    });
    var baru = segs.map(function(g){
      if(!g.trim()) return g;
      var t = g.replace(re, '');
      return semua ? t : '{' + a + '} ' + t;
    }).join('\n\n');
    ta.value = v.slice(0, pStart) + baru + v.slice(pEnd);
    ta.setSelectionRange(pStart + baru.length, pStart + baru.length);
    ta.focus();
  }
  $('toolbar').addEventListener('mousedown', function(e){
    if(e.target.closest && e.target.closest('button')) e.preventDefault();
  });
  $('toolbar').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b || b.disabled) return;
    if(b.getAttribute('data-fmt')) bungkus(b.getAttribute('data-fmt'));
    else if(b.getAttribute('data-align')) rata(b.getAttribute('data-align'));
  });

  var pra = false;
  function aturPratinjau(on){
    pra = on;
    $('pratinjau').hidden = !on;
    $('isi').hidden = on;
    $('btnPratinjau').textContent = on ? 'Kembali ke naskah' : 'Pratinjau';
    Array.prototype.forEach.call($('toolbar').querySelectorAll('[data-fmt],[data-align]'), function(b){ b.disabled = on; });
    if(on) $('pratinjau').innerHTML = renderIsi(bersihkanNaskah($('isi').value)) || '<p>Naskah masih kosong.</p>';
  }
  function keluarPratinjau(){ if(pra) aturPratinjau(false); }
  $('btnPratinjau').addEventListener('click', function(){ aturPratinjau(!pra); });

  // ---- Dua bahasa (Indonesia / Jawa): satu form, dua isi
  var bahasa = 'id';
  var vals = {id:{judul:'',isi:''}, jw:{judul:'',isi:''}};
  function namaBahasa(l){ return l === 'jw' ? 'Jawa' : 'Indonesia'; }
  function tampilBahasa(){
    $('judul').value = vals[bahasa].judul;
    $('isi').value = vals[bahasa].isi;
    $('lblJudul').textContent = 'Judul (' + namaBahasa(bahasa) + ')';
    $('lblIsi').textContent = 'Naskah khutbah (' + namaBahasa(bahasa) + ')';
    Array.prototype.forEach.call($('tabBahasa').querySelectorAll('button'), function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === bahasa));
    });
  }
  function simpanInput(){ vals[bahasa].judul = $('judul').value; vals[bahasa].isi = $('isi').value; }
  function kosongkanBahasa(){ vals = {id:{judul:'',isi:''}, jw:{judul:'',isi:''}}; bahasa = 'id'; tampilBahasa(); }
  function isiBahasa(k){
    vals = {id:{judul:k.judul||'', isi:k.isi||''}, jw:{judul:k.judul_jw||'', isi:k.isi_jw||''}};
    bahasa = 'id'; tampilBahasa();
  }
  $('tabBahasa').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    var l = b.getAttribute('data-l');
    if(l === bahasa) return;
    keluarPratinjau();
    simpanInput();
    bahasa = l;
    tampilBahasa();
  });

  var editId = '';
  var daftar = [];

  function isiDaftar(arr){
    daftar = arr;
    var sel = $('pilihEdit'), cur = editId;
    var h = '<option value="">Tidak, tambah khutbah baru</option>';
    arr.forEach(function(k){
      h += '<option value="' + String(k.id).replace(/"/g,'&quot;') + '">' +
           String(k.judul).replace(/</g,'&lt;') + ' (' + k.tanggal + ')</option>';
    });
    sel.innerHTML = h;
    sel.value = cur;
    var seen = {}, t = '';
    arr.forEach(function(k){
      if(k.tema && !seen[k.tema]){ seen[k.tema] = 1; t += '<option value="' + k.tema.replace(/"/g,'&quot;') + '">'; }
    });
    $('temaList').innerHTML = t;
  }

  // Daftar awal dari file publik (tanpa token)
  fetch('khutbah.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).then(isiDaftar).catch(function(){});

  // Tanggal bawaan: hari ini
  function hariIni(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  $('tanggal').value = hariIni();

  function modeTambah(){
    keluarPratinjau();
    editId = '';
    $('pilihEdit').value = '';
    $('judulHalaman').textContent = 'Tambah Khutbah';
    $('simpan').textContent = 'Simpan ke arsip';
    $('batalEdit').hidden = true;
    $('hapus').hidden = true;
    kosongkanBahasa(); $('tempat').value = ''; $('tema').value = '';
    $('tanggal').value = hariIni();
  }
  function modeEdit(k){
    keluarPratinjau();
    editId = k.id;
    $('judulHalaman').textContent = 'Edit Khutbah';
    $('simpan').textContent = 'Simpan perubahan';
    $('batalEdit').hidden = false;
    $('hapus').hidden = false;
    isiBahasa(k);
    $('tanggal').value = k.tanggal || '';
    $('tema').value = k.tema || '';
    $('tempat').value = k.tempat || '';
    window.scrollTo(0,0);
  }

  // Ambil file, ubah daftarnya, simpan kembali
  function ubah(fnUbah, pesan){
    return api('GET').then(function(res){
      if(!res.ok) throw res;
      return res.json();
    }).then(function(file){
      var arr;
      try { arr = JSON.parse(b64ToText(file.content)); }
      catch(e){ throw new Error('khutbah.json di GitHub bukan JSON yang valid. Perbaiki dulu file itu.'); }
      if(!Array.isArray(arr)) throw new Error('Isi khutbah.json harus berupa daftar (diawali tanda [ ).');
      arr = fnUbah(arr);
      var body = {
        message: pesan,
        content: textToB64(JSON.stringify(arr, null, 2) + '\n'),
        sha: file.sha
      };
      if(BRANCH) body.branch = BRANCH;
      return api('PUT', body).then(function(res){
        if(!res.ok) throw res;
        return arr;
      });
    });
  }

  function tampilGalat(e){
    if(e && typeof e.status === 'number') setStatus(errPesan(e), 'err');
    else if(e && e.message && /Failed to fetch|NetworkError/i.test(e.message)) setStatus('Tidak bisa terhubung ke GitHub. Cek koneksi internet.', 'err');
    else setStatus((e && e.message) || 'Terjadi kesalahan.', 'err');
  }

  var sedang = false;
  function mulai(msg){ sedang = true; $('simpan').disabled = true; $('hapus').disabled = true; setStatus(msg, ''); }
  function selesai(){ sedang = false; $('simpan').disabled = false; $('hapus').disabled = false; }

  // Pilih khutbah untuk diedit
  $('pilihEdit').addEventListener('change', function(){
    var id = $('pilihEdit').value;
    if(!id){ modeTambah(); setStatus('', ''); return; }
    if(!token()){ $('pilihEdit').value = editId; setStatus('Tempel token GitHub dulu di kotak paling atas.', 'err'); return; }
    if(sedang) return;
    mulai('Mengambil naskah…');
    api('GET').then(function(res){
      if(!res.ok) throw res;
      return res.json();
    }).then(function(file){
      var arr = JSON.parse(b64ToText(file.content));
      var k = arr.filter(function(x){ return x.id === id; })[0];
      if(!k) throw new Error('Khutbah tidak ditemukan di GitHub.');
      isiDaftar(arr);
      modeEdit(k);
      setStatus('', '');
    }).catch(function(e){
      $('pilihEdit').value = editId;
      tampilGalat(e);
    }).then(selesai);
  });

  $('batalEdit').addEventListener('click', function(){ modeTambah(); setStatus('', ''); });

  // Simpan (baru atau perubahan)
  $('simpan').addEventListener('click', function(){
    if(sedang) return;
    simpanInput();
    var judul = vals.id.judul.trim();
    var judulJw = vals.jw.judul.trim();
    var tanggal = $('tanggal').value;
    var tema = $('tema').value.trim();
    var tempat = $('tempat').value.trim();
    var isi = bersihkanNaskah(vals.id.isi);
    var isiJw = bersihkanNaskah(vals.jw.isi);

    if(!token()){ setStatus('Tempel token GitHub dulu di kotak paling atas.', 'err'); return; }
    if(!judul){ setStatus('Judul Indonesia belum diisi. Versi Indonesia wajib, versi Jawa boleh dikosongkan.', 'err'); return; }
    if(!tanggal){ setStatus('Tanggal belum diisi.', 'err'); return; }
    if(!isi){ setStatus('Naskah Indonesia masih kosong. Versi Indonesia wajib, versi Jawa boleh dikosongkan.', 'err'); return; }

    function terapkanJw(o){
      if(judulJw) o.judul_jw = judulJw; else delete o.judul_jw;
      if(isiJw) o.isi_jw = isiJw; else delete o.isi_jw;
    }
    var sedangEdit = !!editId, idEdit = editId;
    mulai(sedangEdit ? 'Menyimpan perubahan…' : 'Menyimpan ke GitHub…');

    ubah(function(arr){
      if(sedangEdit){
        var i = -1;
        arr.forEach(function(k, n){ if(k.id === idEdit) i = n; });
        if(i < 0) throw new Error('Khutbah yang diedit sudah tidak ada di GitHub.');
        var lama = arr[i];
        lama.judul = judul; lama.tanggal = tanggal; lama.tema = tema; lama.tempat = tempat; lama.isi = isi; terapkanJw(lama);
        return arr;
      }
      var base = slug(judul) + '-' + tanggal, id = base, n = 2;
      var ada = function(x){ return arr.some(function(k){ return k.id === x; }); };
      while(ada(id)){ id = base + '-' + n; n++; }
      var baru = { id: id, judul: judul, tanggal: tanggal, tema: tema, tempat: tempat, isi: isi };
      terapkanJw(baru);
      arr.unshift(baru);
      return arr;
    }, (sedangEdit ? 'Edit khutbah: ' : 'Tambah khutbah: ') + judul).then(function(arr){
      modeTambah();
      isiDaftar(arr);
      setStatus(sedangEdit ? 'Perubahan tersimpan. Tampil di arsip dalam 1-2 menit.' : 'Tersimpan. Khutbah akan muncul di arsip dalam 1-2 menit.', 'ok');
    }).catch(tampilGalat).then(selesai);
  });

  // Hapus
  $('hapus').addEventListener('click', function(){
    if(sedang || !editId) return;
    simpanInput();
    var idHapus = editId, judul = (vals.id.judul || vals.jw.judul).trim();
    if(!confirm('Hapus khutbah "' + judul + '" dari arsip? Ini tidak bisa dibatalkan dari halaman ini.')) return;
    mulai('Menghapus…');
    ubah(function(arr){
      var sisa = arr.filter(function(k){ return k.id !== idHapus; });
      if(sisa.length === arr.length) throw new Error('Khutbah sudah tidak ada di GitHub.');
      return sisa;
    }, 'Hapus khutbah: ' + judul).then(function(arr){
      modeTambah();
      isiDaftar(arr);
      setStatus('Khutbah dihapus. Hilang dari arsip dalam 1-2 menit.', 'ok');
    }).catch(tampilGalat).then(selesai);
  });

  showTokenState();
})();
</script>
</body>
</html>
